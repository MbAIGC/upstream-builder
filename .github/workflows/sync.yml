name: sync

# 定时检查上游变化（计划 9.1）：把变化的上游源码快照同步进 upstream/<name>/ 并提交，
# 然后显式触发 build。
#
# 两个关键点：
#   1. 源码落库用 upstream/<name>/ 命名空间，而不是仓库根目录。上游自带的 .gitignore
#      作用域是所在目录及子目录，放根目录会让两个上游的规则互相覆盖（实测会静默丢掉
#      测试文件），放进各自子目录后互不干扰。提交时用 git add -f 强制纳入，
#      保证快照等于上游 tar.gz 的内容。
#   2. GITHUB_TOKEN 推送产生的事件不会触发其它 workflow，所以必须显式
#      `gh workflow run build.yml`，且本 Job 需要 actions:write。

on:
  schedule:
    - cron: '17 3 * * *'      # 避开整点：GitHub schedule 在整点排队严重
  workflow_dispatch:
    inputs:
      project:
        description: '项目名，或 all'
        type: string
        default: all
      force:
        description: '忽略 SHA 未变化，强制构建'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 提交 reports/upstream-state.json
      actions: write           # gh workflow run build.yml
    outputs:
      has_work: ${{ steps.plan.outputs.has_work }}
      projects: ${{ steps.plan.outputs.projects }}
      pins: ${{ steps.plan.outputs.pins }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验 upstream.json
        run: python3 scripts/ub.py validate

      - name: 解析上游最新 SHA 并决定构建范围
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT: ${{ inputs.project }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=(--project "${PROJECT:-all}" --github-output)
          [ "${FORCE:-false}" = "true" ] && args+=(--force)
          python3 scripts/ub.py plan "${args[@]}"

      - name: 同步源码快照到 upstream/
        id: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT: ${{ inputs.project }}
          PINS: ${{ steps.plan.outputs.pins }}
        run: |
          set -euo pipefail
          args=(--project "${PROJECT:-all}" --github-output)
          [ -n "$PINS" ] && args+=(--pins "$PINS")
          python3 scripts/ub.py sync-source-all "${args[@]}"

      - name: 提交快照与状态
        run: >-
          bash scripts/commit-and-push.sh
          "chore(sync): 同步上游源码快照与状态 [skip ci]"

      - name: 触发构建（显式 dispatch，而不是依赖 push 事件）
        if: steps.plan.outputs.has_work == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS: ${{ steps.plan.outputs.projects }}
          PINS: ${{ steps.plan.outputs.pins }}
        run: |
          set -euo pipefail
          echo "触发的项目: $PROJECTS"
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            -f project="$PROJECTS" \
            -f pins="$PINS" \
            -f publish=true

      - name: 摘要
        if: always()
        env:
          HAS_WORK: ${{ steps.plan.outputs.has_work }}
          PROJECTS: ${{ steps.plan.outputs.projects }}
        run: |
          {
            echo "## 上游同步"
            echo ""
            echo "- 快照变更：\`${{ steps.source.outputs.changed || '无' }}\`"
            if [ "$HAS_WORK" = "true" ]; then
              echo "- 已触发构建：\`$PROJECTS\`"
            else
              echo "- 上游无变化（或命中节流），未触发构建。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
